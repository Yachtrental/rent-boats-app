name: ClickAndBoat Palma Audit

on:
  pull_request:
    paths:
      - 'tools/clickandboat-audit/**'
      - '.github/workflows/clickandboat-palma-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/clickandboat-audit/requirements.txt

      - name: Fetch search controllers
        run: python tools/clickandboat-audit/fetch_search_controllers.py

      - name: Upload controllers
        uses: actions/upload-artifact@v4
        with:
          name: clickandboat-search-controllers
          path: tools/clickandboat-audit/controller-output
          if-no-files-found: error
          retention-days: 7

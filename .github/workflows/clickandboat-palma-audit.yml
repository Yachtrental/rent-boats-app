name: ClickAndBoat Palma Audit

on:
  pull_request:
    paths:
      - 'tools/clickandboat-audit/**'
      - '.github/workflows/clickandboat-palma-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TARGET_URL: https://www.clickandboat.com/es/alquiler/pais-espana/isla-mallorca/ciudad-palma
      OUTPUT_DIR: tools/clickandboat-audit/output
      MAX_PAGES: '320'
      WORKERS: '10'
      STRICT_COUNT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/clickandboat-audit/requirements.txt

      - name: Collect complete public inventory
        id: collect
        continue-on-error: true
        run: python tools/clickandboat-audit/scrape.py

      - name: Show summary
        if: always()
        run: |
          if [ -f tools/clickandboat-audit/output/resumen.json ]; then
            cat tools/clickandboat-audit/output/resumen.json
          else
            echo 'No summary was produced.'
          fi

      - name: Upload audit database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickandboat-palma-database
          path: tools/clickandboat-audit/output
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce complete result
        if: steps.collect.outcome != 'success'
        run: exit 1
